name: CI

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]
  workflow_dispatch: # allows manual trigger from the GitHub Actions UI

permissions:
  contents: read
  packages: read

# Cancel in-progress runs for the same branch/PR to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (ROS2 Jazzy / Slicer 5.10)
    runs-on: ubuntu-latest

    # Pull the pre-built CI image from GHCR.
    # The image contains Ubuntu 24.04 + ROS2 Jazzy + Slicer 5.10 (from source).
    # Rebuild it locally and push a new tag only when Ubuntu/ROS2/Slicer versions change.
    # See docker/build-and-push.sh for instructions.
    container:
      image: ghcr.io/${{ github.repository_owner }}/slicer_ros2_module/ci:jazzy-slicer-v5.10.0
      # For private GHCR images, add a repo secret named PERSONAL_GHCR_PAT
      # with at least read:packages scope.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.PERSONAL_GHCR_PAT }}

    # GitHub Actions defaults to /bin/sh — force bash so 'source' works
    defaults:
      run:
        shell: bash

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the module source into a colcon workspace layout
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Place the source under ws/src/slicer_ros2_module so colcon
          # finds it as a single package workspace.
          path: ws/src/slicer_ros2_module

      # -----------------------------------------------------------------------
      # 2. Build the module with colcon
      # -----------------------------------------------------------------------
      - name: Build
        working-directory: ws
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          colcon build \
            --cmake-args \
              -DSlicer_DIR:PATH=$Slicer_DIR \
              -DCMAKE_BUILD_TYPE=Release \
            --event-handlers console_cohesion+

      # -----------------------------------------------------------------------
      # 3. Start virtual display (needed by ROS2 subprocess nodes, e.g. turtlesim)
      #    Slicer itself runs with --no-main-window (set in Testing CMakeLists)
      #    so it does not need a real display — but its subprocess children do.
      # -----------------------------------------------------------------------
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      # -----------------------------------------------------------------------
      # 4. Run tests using Slicer with the test module
      # -----------------------------------------------------------------------
      - name: Test
        working-directory: ws
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          source install/setup.bash
          ros2 run slicer_ros2_module test_ci

      # -----------------------------------------------------------------------
      # 4. Upload build/test logs as an artifact (visible even on failure)
      # -----------------------------------------------------------------------
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs
          path: ws/log/
          retention-days: 14
